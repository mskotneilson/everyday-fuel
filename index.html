<body>
<header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-logo">✳</span><div><div>Everyday Fuel</div><div class="top-subtitle">Low-effort nutrition + consistent training</div></div></div><nav class="nav" id="topNav" aria-label="App sections"></nav></div></header>
<main id="app"></main>
<nav class="bottomnav" id="bottomNav" aria-label="App sections"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<dialog class="modal" id="mealDialog"><form method="dialog" id="mealForm" class="modal-body"><h2 class="modal-title" id="modalHeading">Add meal</h2><p class="hint">Use an estimate. It doesn't need to be perfect.</p><div class="field" style="margin-top:16px"><label for="mealName">What did you eat?</label><input required id="mealName" maxlength="80" placeholder="e.g. Chicken salad"></div><div class="modal-grid"><div class="field"><label for="mealProtein">Estimated protein (g)</label><input required type="number" id="mealProtein" min="0" max="250" step="1"></div><div class="field"><label for="mealSlot">Meal</label><select id="mealSlot"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select></div></div><div class="two-buttons"><button type="button" class="btn" data-action="close-meal">Cancel</button><button type="submit" class="btn primary">Save meal</button></div></form></dialog>
<dialog class="modal" id="stockDialog"><form method="dialog" id="stockForm" class="modal-body"><h2 class="modal-title">Add office food</h2><p class="hint">Track only foods you want to keep stocked at work.</p><div class="field" style="margin-top:14px"><label for="stockName">Food name</label><input required id="stockName" maxlength="60" placeholder="e.g. Protein yogurt"></div><div class="modal-grid"><div class="field"><label for="stockQty">How many on hand?</label><input id="stockQty" required type="number" min="0" max="999" value="0"></div><div class="field"><label for="stockTarget">Restock level</label><input id="stockTarget" required type="number" min="1" max="999" value="4"></div><div class="field"><label for="stockLoc">Store it in</label><select id="stockLoc"><option value="Freezer">Freezer</option><option value="Fridge">Fridge</option><option value="Shelf">Shelf / drawer</option></select></div><div class="field"><label for="stockProtein">Protein per serving (g)</label><input id="stockProtein" type="number" min="0" max="250" value="25"></div></div><div class="two-buttons"><button type="button" class="btn" data-action="close-stock">Cancel</button><button type="submit" class="btn primary">Add food</button></div></form></dialog>
<script>
'use strict';
const STORAGE_KEY='everyday-fuel-v1';
const SLOTS={breakfast:{label:'Breakfast',icon:'🥤'},lunch:{label:'Lunch',icon:'🥪'},dinner:{label:'Dinner',icon:'🍽️'},snack:{label:'Snacks',icon:'🍓'}};
const DEFAULT_SHOP=[['Greek yogurt','Home'],['Milk or preferred shake mixer','Home'],['Bananas and berries','Home'],['Eggs','Home'],['Cooked chicken / rotisserie chicken','Home'],['Lean ground beef or turkey','Home'],['Microwave rice','Home'],['Tortillas','Home'],['Black beans','Home'],['High-protein pasta and marinara','Home'],['Steam-in-bag vegetables','Home'],['Salad greens / easy vegetables','Home'],['Cheese','Home'],['Protein snacks','Home']];
const RECIPES=[
{id:'taco',name:'Chicken taco bowls / quesadillas',mins:15,protein:40,desc:'Cooked chicken, microwave rice, canned beans, cheese, salsa and tortillas.',kid:'Kids make quesadillas; you have a chicken-heavy bowl.',ingredients:['Cooked chicken','Microwave rice','Black beans','Tortillas','Cheese','Salsa']},
{id:'rotisserie',name:'Rotisserie chicken + potatoes',mins:10,protein:40,desc:'Rotisserie chicken, microwave potatoes and steam-in-bag broccoli.',kid:'Serve everything separately; add fruit if preferred.',ingredients:['Rotisserie chicken','Potatoes','Frozen broccoli']},
{id:'pasta',name:'Protein pasta + meat sauce',mins:20,protein:42,desc:'Protein pasta, lean ground beef or turkey, jarred tomato sauce.',kid:'Everyone has pasta; give yourself more meat sauce.',ingredients:['High-protein pasta','Lean ground meat','Marinara']},
{id:'eggs',name:'Eggs, toast + fruit',mins:10,protein:35,desc:'Scrambled eggs, toast and berries, with Greek yogurt or cottage cheese.',kid:'Fast breakfast-for-dinner night.',ingredients:['Eggs','Whole-grain bread','Fruit','Greek yogurt']},
{id:'burgers',name:'Quick turkey burgers',mins:18,protein:40,desc:'Lean turkey patties, buns and bagged salad or frozen vegetables.',kid:'Kids can have classic burgers; adjust toppings and sides.',ingredients:['Turkey or beef patties','Buns','Salad or frozen vegetables']},
{id:'stirfry',name:'Shortcut chicken stir-fry',mins:15,protein:40,desc:'Pre-cooked chicken, frozen stir-fry vegetables and microwave rice.',kid:'Serve chicken, vegetables and rice separately.',ingredients:['Cooked chicken','Frozen stir-fry vegetables','Microwave rice','Stir-fry sauce']},
{id:'pizza',name:'Pizza night + easy protein',mins:15,protein:35,desc:'Your normal family pizza; add chicken, Greek yogurt or cottage cheese if useful.',kid:'No separate meal required.',ingredients:['Pizza or pizza ingredients','Optional protein side']},
{id:'leftovers',name:'Leftovers / clean-out night',mins:5,protein:35,desc:'Use leftovers, frozen meals or pantry staples. Add protein if needed.',kid:'Everyone can pick from what is available.',ingredients:[]}
];
const ROUTINES={
upperA:{name:'Upper A · Chest + back',duration:'55–65 min',ex:[['Flat bench press','3','6–10'],['Seated cable row','3','8–12'],['Incline bench press (20–30°)','2','8–12'],['Lat pulldown, medium grip','3','8–12'],['Single-arm cable lateral raise','3','12–20'],['Cable biceps curl','2','10–15'],['Rope triceps pushdown','2','10–15']]},
lowerA:{name:'Lower A · Quads + hamstrings',duration:'50–60 min',ex:[['Barbell/Smith squat','3','6–10'],['Romanian deadlift','3','8–12'],['Reverse lunge','2','8–12/leg'],['Cable hamstring curl','3','10–15'],['Standing calf raise','3','12–20'],['Pallof press','2','10–15/side']]},
upperB:{name:'Upper B · Shoulders + lats',duration:'55–65 min',ex:[['Incline bench press','3','6–10'],['Lat pulldown, neutral grip','3','8–12'],['Chest-supported cable row','3','8–12'],['Seated cable shoulder press','2','8–12'],['Cable chest fly','2','12–15'],['Reverse cable fly','2','12–20'],['Cable hammer curl','2','10–15'],['Overhead cable triceps extension','2','10–15']]},
lowerB:{name:'Lower B · Glutes + legs',duration:'50–60 min',ex:[['Bulgarian split squat','3','8–12/leg'],['Barbell hip thrust','3','8–12'],['Cable leg extension','2','10–15/leg'],['Cable hamstring curl','3','10–15'],['Standing calf raise','3','12–20'],['Cable crunch','2','10–15']]}
};
function isoLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function offset(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return isoLocal(d)}
function dow(s){return parseDate(s).getDay()}
function monday(s){return offset(s,-((dow(s)+6)%7))}
function humanDate(s,opt={weekday:'short',month:'short',day:'numeric'}){return parseDate(s).toLocaleDateString(undefined,opt)}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function fresh(){return {version:1,profile:{protein:140},days:{},dinners:{},stock:[{id:'frozen',name:'Frozen high-protein lunches',qty:0,target:4,place:'Freezer',protein:32},{id:'yogurt',name:'Greek yogurt cups',qty:0,target:4,place:'Fridge',protein:18},{id:'chicken',name:'Chicken pouches / packets',qty:0,target:2,place:'Shelf',protein:25},{id:'bars',name:'Protein bars',qty:0,target:3,place:'Shelf',protein:20}],shopping:DEFAULT_SHOP.map((x,i)=>({id:'shop'+i,name:x[0],group:x[1],checked:false}))}}
let state;
try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?JSON.parse(raw):fresh();if(!state||state.version!==1||!state.profile||!state.days||!Array.isArray(state.stock)||!Array.isArray(state.shopping))state=fresh()}catch(e){state=fresh()}
let selectedDate=isoLocal(new Date()),activeTab='today',toastTimer=null,editingMealId=null;
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){toast('Cannot save in this browser. Export a backup from Settings.')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function day(s=selectedDate){return state.days[s]||(state.days[s]={meals:[],workout:null})}
function meals(s=selectedDate){return state.days[s]?.meals||[]}
function total(s=selectedDate){return meals(s).reduce((v,m)=>v+(Number(m.protein)||0),0)}
function planFor(s){return state.dinners[s]||({0:'leftovers',1:'taco',2:'pasta',3:'rotisserie',4:'eggs',5:'burgers',6:'stirfry'}[dow(s)])}
function recipeById(id){return RECIPES.find(r=>r.id===id)||RECIPES[0]}
function suggestedWorkout(s){return ({1:'upperA',3:'lowerA',4:'upperB',5:'lowerB',6:'lowerB'})[dow(s)]||'upperA'}
function workoutData(s=selectedDate){return state.days[s]?.workout||null}
function exerciseKey(r,index){return r+':'+index}
function previousExercise(currentDate,r,index){const key=exerciseKey(r,index);const list=Object.keys(state.days).filter(x=>x<currentDate).sort().reverse();for(const date of list){const entry=state.days[date]?.workout?.entries?.[key];if(entry&&(entry.weight||entry.reps))return entry;}return null}
const TABS=[['today','Today','☀️'],['dinners','Dinners','🍽️'],['work','Work stash','🧊'],['shop','Shopping','🛒'],['train','Training','💪'],['settings','Settings','⚙️']];
function nav(){for(const id of ['topNav','bottomNav']){document.getElementById(id).innerHTML=TABS.map(t=>`<button type="button" data-action="tab" data-tab="${t[0]}" class="${activeTab===t[0]?'active':''}" aria-current="${activeTab===t[0]?'page':'false'}"><span class="${id==='bottomNav'?'emoji':''}">${id==='bottomNav'?t[2]:''}</span>${id==='bottomNav'?({work:'Work',shop:'Shop',train:'Train',settings:'More'}[t[0]]||t[1]):t[1]}</button>`).join('')}}
function dateHeading(title,subtitle,withDate=true){return `<div class="header"><div><div class="eyebrow">MAKE IT EASY TO STAY CONSISTENT</div><h1>${title}</h1><p class="hint">${subtitle}</p></div>${withDate?`<div class="date-nav"><button class="btn" data-action="date-back" title="Previous day" aria-label="Previous day">‹</button><span class="date-label">${humanDate(selectedDate)}</span><button class="btn" data-action="date-next" title="Next day" aria-label="Next day">›</button></div>`:''}</div>`}
function todayView(){const protein=Number(state.profile.protein)||140;const t=total(),pct=Math.round(t/protein*100);const routine=suggestedWorkout(selectedDate),w=workoutData();const entries=meals();const slots=['breakfast','lunch','dinner','snack'];const entriesCount=slots.filter(slot=>entries.some(m=>m.slot===slot)).length;const seven=Array.from({length:7},(_,i)=>offset(monday(selectedDate),i));const workLow=state.stock.filter(s=>s.qty<s.target);return `${dateHeading('Your daily check-in','A few taps are enough. No calorie counting required.')}
<div class="grid"><section class="card hero span-5"><div class="card-head"><div><div class="eyebrow" style="color:#b8f0b6">PROTEIN TODAY</div><h2 class="stat-value">${t}<small> / ${protein} g</small></h2></div><span style="font-size:31px">🥗</span></div><div class="progress" role="progressbar" aria-valuenow="${Math.min(pct,100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Protein progress"><span style="width:${Math.min(pct,100)}%"></span></div><div class="hero-bottom"><div class="subtle">${t>=protein?'Target reached — great consistency.':`${Math.max(0,protein-t)} g to your flexible daily target`}</div><button class="btn small" data-action="edit-target">Edit goal</button></div><div class="metric-row"><span class="metric-pill"><strong>${entriesCount}/4</strong> meal categories</span><span class="metric-pill"><strong>${Math.min(Math.round(pct),100)}%</strong> of target</span></div></section>
<section class="card span-7"><div class="card-head"><div><h2 class="card-title">This week's rhythm</h2><p class="subtle">Tap any day to review or fill in later.</p></div></div><div class="day-chips">${seven.map(s=>{const v=total(s);const has=meals(s).length;return `<button class="day-chip ${s===isoLocal(new Date())?'today':''} ${s===selectedDate?'active':''}" data-action="choose-date" data-date="${s}" title="${humanDate(s)}: ${v} g protein"><span class="dw">${humanDate(s,{weekday:'short'})}</span><span class="dd">${parseDate(s).getDate()}</span><span class="dot ${v>=protein?'good':has?'partial':''}"></span></button>`}).join('')}</div><hr class="separator"><div class="item-line"><div><strong style="font-size:13px">${w?.done?'✅ Workout complete':dow(selectedDate)===1||dow(selectedDate)===3||dow(selectedDate)===4||dow(selectedDate)===5||dow(selectedDate)===6?'Planned workout':'Recovery / walking'}</strong><div class="subtle">${(dow(selectedDate)===1||dow(selectedDate)===3||dow(selectedDate)===4||dow(selectedDate)===5||dow(selectedDate)===6)?ROUTINES[w?.routine||routine].name:'Low-stress activity is enough'}</div></div><button class="btn small" data-action="tab" data-tab="train">Open training</button></div></section>
<section class="card span-8"><div class="card-head"><div><h2 class="card-title">Meals today</h2><p class="subtle">One-click estimates. Change the grams if needed.</p></div><button class="btn small" data-action="open-meal" data-slot="snack">+ Custom food</button></div>${slots.map(slot=>mealSection(slot,entries)).join('')}</section>
<div class="span-4 stack"><section class="card"><h2 class="card-title">Tonight's easy dinner</h2>${(()=>{const r=recipeById(planFor(selectedDate));return `<div style="font-size:25px;margin:10px 0 3px">🍲</div><strong>${escapeHtml(r.name)}</strong><p class="subtle">${r.mins} minutes · ~${r.protein} g protein</p><p class="hint">${escapeHtml(r.desc)}</p><p class="tip" style="margin:12px 0 8px"><strong>Kid-friendly:</strong> ${escapeHtml(r.kid)}</p><button class="btn small" data-action="tab" data-tab="dinners">Change dinner plan</button>`})()}</section>
<section class="card"><div class="card-head"><h2 class="card-title">Work lunch safety net</h2><span class="tag ${workLow.length?'warn':'good'}">${workLow.length?`${workLow.length} to refill`:'Stocked'}</span></div>${state.stock.slice(0,4).map(s=>`<div class="item-line" style="padding:5px 0"><span class="subtle">${escapeHtml(s.name)}</span><strong style="font-size:12px">${s.qty} left</strong></div>`).join('')}<button class="btn small" style="margin-top:13px" data-action="tab" data-tab="work">Manage office food</button></section></div></div>`}
function mealSection(slot,entries){const info=SLOTS[slot],ms=entries.filter(m=>m.slot===slot),p=ms.reduce((s,m)=>s+m.protein,0);const opts=({breakfast:[['Shake + water','shake',30],['Shake + milk / oats','shakeoats',35]],lunch:[['Rep lunch','rep',30],['Frozen work meal','frozen',32],['Chicken wrap','wrap',38]],dinner:[['Planned dinner','planned',recipeById(planFor(selectedDate)).protein],['Other dinner','other',40]],snack:[['Greek yogurt','yogurt',18],['Protein shake','shake',30],['Protein bar','bar',20]]})[slot];return `<div class="meal-row"><div class="meal-icon">${info.icon}</div><div class="meal-body"><div class="meal-title"><span>${info.label}</span><span class="status ${ms.length?'':'missing'}">${ms.length?`${p} g logged`:'Not logged'}</span></div>${ms.length?`<div class="stack-tight" style="margin:8px 0 9px">${ms.map(m=>`<div class="item-line"><span class="subtle">${escapeHtml(m.name)} · ${m.protein} g</span><div class="two-buttons"><button class="btn small ghost" data-action="edit-meal" data-id="${escapeHtml(m.id)}" title="Edit">Edit</button><button class="btn small ghost danger" data-action="delete-meal" data-id="${escapeHtml(m.id)}" aria-label="Remove ${escapeHtml(m.name)}">×</button></div></div>`).join('')}</div>`:`<div class="meal-info">${slot==='lunch'?'Rep lunch or freezer backup — either works.':slot==='dinner'?'One shared family meal. No separate cooking.':slot==='breakfast'?'Your automatic morning protein shake.':'Only if helpful to reach your protein target.'}</div>`}<div class="meal-actions">${opts.map(o=>`<button class="btn" data-action="quick-meal" data-slot="${slot}" data-preset="${o[1]}">${escapeHtml(o[0])}</button>`).join('')}<button class="btn" data-action="open-meal" data-slot="${slot}">+ Custom</button></div></div></div>`}
function weeklyView(){const start=monday(selectedDate),dates=Array.from({length:7},(_,i)=>offset(start,i)),protein=Number(state.profile.protein)||140;const met=dates.filter(s=>total(s)>=protein).length;const logged=dates.filter(s=>meals(s).length).length;return `<section class="card"><div class="card-head"><div><h2 class="card-title">Protein check-ins this week</h2><p class="subtle">${met} days met target · ${logged} days logged · ${humanDate(start)} – ${humanDate(offset(start,6))}</p></div></div><div class="week-bars">${dates.map(s=>{const p=Math.min(100,Math.round(total(s)/protein*100));return `<div class="bar-wrap"><span class="mini">${total(s)||''}</span><div class="bar ${p>=100?'hit':''}" style="height:${Math.max(4,p*.72)}px" title="${humanDate(s)}: ${total(s)} g"></div><span class="bar-caption">${humanDate(s,{weekday:'short'})}</span></div>`}).join('')}</div><p class="fineprint" style="margin:15px 0 0">Tracking is optional, and approximate protein counts are fine. Trends are more useful than perfect records.</p></section>`}
function dinnersView(){const start=monday(selectedDate),dates=Array.from({length:7},(_,i)=>offset(start,i));const picks=dates.map(d=>recipeById(planFor(d)));return `${dateHeading('Family dinner planner','Five to twenty minutes. Same meal for you and your kids.',false)}<div class="grid"><section class="card span-8"><div class="card-head"><div><h2 class="card-title">${humanDate(start)} – ${humanDate(offset(start,6))}</h2><p class="subtle">Choose a dinner for each day. Thursday stays easy by default.</p></div><div class="two-buttons"><button class="btn small" data-action="week-back">‹ Week</button><button class="btn small" data-action="week-next">Week ›</button></div></div>${dates.map(s=>{const r=recipeById(planFor(s));return `<div class="recipe"><div class="recipe-left"><span class="day">${humanDate(s,{weekday:'long',month:'short',day:'numeric'})} ${dow(s)===4?'· kids night':''}</span><select aria-label="Dinner for ${humanDate(s)}" data-action="dinner-select" data-date="${s}">${RECIPES.map(x=>`<option value="${x.id}" ${r.id===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select><div class="recipe-desc">${r.mins} min · ~${r.protein} g protein · ${escapeHtml(r.desc)}</div></div></div>`}).join('')}<div class="two-buttons" style="margin-top:17px"><button class="btn primary" data-action="copy-dinner-list">Copy dinner ingredients</button><button class="btn" data-action="reset-dinners">Reset this week</button></div></section><div class="span-4 stack"><section class="card"><h2 class="card-title">Keep Thursdays simple</h2><p class="hint">On nights you need to feed the kids, easy beats perfect. Shortcuts like cooked chicken, frozen vegetables and microwave rice are intentional parts of this plan.</p><p class="tip" style="margin:14px 0 0">Protein is approximate per adult portion. Kids should eat appropriate amounts for their age and appetite, without using your fat-loss portions.</p></section><section class="card"><h2 class="card-title">This week's ingredients</h2><div class="stack-tight" style="margin-top:9px">${[...new Set(picks.flatMap(p=>p.ingredients))].slice(0,18).map(x=>`<span class="subtle">• ${escapeHtml(x)}</span>`).join('')||'<p class="subtle">Use what you already have.</p>'}</div></section></div></div>`}
function workView(){const low=state.stock.filter(s=>s.qty<s.target),fridge=state.stock.filter(s=>s.place==='Fridge'),freezer=state.stock.filter(s=>s.place==='Freezer'),shelf=state.stock.filter(s=>s.place==='Shelf');return `${dateHeading('Office lunch stash','Keep enough food at work that lunch prep becomes optional.',false)}<div class="grid"><section class="card span-8"><div class="card-head"><div><h2 class="card-title">Your work food inventory</h2><p class="subtle">Tap − when you eat one; tap + when you restock.</p></div><button class="btn small primary" data-action="open-stock">+ Add food</button></div>${[['Freezer',freezer],['Fridge',fridge],['Shelf / drawer',shelf]].map(([label,arr])=>`<div style="margin-top:16px"><strong style="font-size:13px">${label}</strong>${arr.length?arr.map(s=>`<div class="stock"><div><strong style="font-size:13px">${escapeHtml(s.name)}</strong><div class="subtle">Target ${s.target} · ~${s.protein} g protein/serving</div>${s.qty<s.target?`<span class="tag warn">Restock ${s.target-s.qty}</span>`:`<span class="tag good">Enough stocked</span>`}</div><div class="stepper"><button class="btn" data-action="stock-down" data-id="${escapeHtml(s.id)}" aria-label="Use one ${escapeHtml(s.name)}">−</button><span class="count">${s.qty}</span><button class="btn" data-action="stock-up" data-id="${escapeHtml(s.id)}" aria-label="Add one ${escapeHtml(s.name)}">+</button></div></div>`).join(''):'<p class="subtle">Nothing tracked here yet.</p>'}</div>`).join('')}</section><div class="span-4 stack"><section class="card"><h2 class="card-title">Refill reminder</h2>${low.length?`<p class="hint">These items are below your target:</p><div class="stack-tight" style="margin:13px 0">${low.map(s=>`<div class="item-line"><span class="subtle">${escapeHtml(s.name)}</span><span class="tag warn">+${s.target-s.qty}</span></div>`).join('')}</div><button class="btn primary wide" data-action="tab" data-tab="shop">See shopping list</button>`:`<p class="tip">All tracked office foods are at or above your target levels.</p>`}</section><section class="card"><h2 class="card-title">Why this works</h2><p class="hint">When rep lunches happen, enjoy them. When they don't, your backup is already at work. Choose frozen meals with a useful protein serving and vegetables if possible.</p><button class="btn small" style="margin-top:13px" data-action="open-stock">Track another food</button></section></div></div>`}
function shopView(){const low=state.stock.filter(s=>s.qty<s.target),unchecked=state.shopping.filter(s=>!s.checked);return `${dateHeading('One reusable shopping list','Buy easy food, not an elaborate meal-prep project.',false)}<div class="grid"><section class="card span-7"><div class="card-head"><div><h2 class="card-title">Your shopping checklist</h2><p class="subtle">Check items as you order them. Reset for next week.</p></div><button class="btn small" data-action="reset-shopping">Reset checks</button></div><div class="store-list">${state.shopping.map(s=>`<label class="check-line ${s.checked?'checked':''}"><input type="checkbox" data-action="shop-check" data-id="${escapeHtml(s.id)}" ${s.checked?'checked':''}><span class="check-title">${escapeHtml(s.name)}</span><span class="meta">${escapeHtml(s.group)}</span><button type="button" class="btn small ghost danger" data-action="shop-delete" data-id="${escapeHtml(s.id)}" title="Remove from list" aria-label="Remove ${escapeHtml(s.name)}">×</button></label>`).join('')}</div><form id="addShopping" class="form-row" style="margin-top:17px"><div class="field"><label for="shoppingName">Add an item</label><input id="shoppingName" required maxlength="80" placeholder="e.g. Frozen chicken bowls"></div><button class="btn primary" type="submit">Add</button></form></section><div class="span-5 stack"><section class="card"><h2 class="card-title">Office items to replenish</h2>${low.length?`<div class="stack-tight" style="margin-top:9px">${low.map(s=>`<div class="item-line"><span class="subtle">${escapeHtml(s.name)}</span><span class="tag warn">${s.target-s.qty} needed</span></div>`).join('')}</div>`:'<p class="tip">Office backup foods are stocked.</p>'}<hr class="separator"><button class="btn primary wide" data-action="copy-shopping">📋 Copy shopping list (${unchecked.length+low.length})</button><p class="mini">Copies unchecked groceries + current work restock amounts.</p></section><section class="card"><h2 class="card-title">Order groceries</h2><p class="hint">Copy the list first, then use either store's app or site to place the order. This tracker doesn't connect to store carts.</p><div class="two-buttons" style="margin-top:13px"><a class="btn" href="https://www.walmart.com/" target="_blank" rel="noopener noreferrer">Walmart ↗</a><a class="btn" href="https://www.samsclub.com/" target="_blank" rel="noopener noreferrer">Sam's Club ↗</a></div></section><section class="card"><h2 class="card-title">Keep the order predictable</h2><p class="hint">Reorder the same basics weekly. Frozen meals and protein staples matter more than buying ingredients for complicated recipes.</p></section></div></div>`}
function trainView(){const w=workoutData(),routine=w?.routine||suggestedWorkout(selectedDate),r=ROUTINES[routine],done=!!w?.done,entries=w?.entries||{},proteinGoal=Number(state.profile.protein)||140;return `${dateHeading('Strength training','A four-session rotation. Use the load numbers shown on your Speediance.')}
<div class="grid"><section class="card span-8"><div class="card-head"><div><h2 class="card-title">Session log</h2><p class="subtle">${r.duration} · Save resistance and actual reps, then mark complete.</p></div><span class="tag ${done?'good':'warn'}">${done?'Completed':'Not finished'}</span></div><div class="form-row" style="margin-bottom:14px"><div class="field"><label for="routineSelect">Workout</label><select id="routineSelect" data-action="routine-select">${Object.entries(ROUTINES).map(([k,v])=>`<option value="${k}" ${k===routine?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}</select></div><button class="btn ${done?'':'primary'}" data-action="toggle-workout">${done?'↶ Mark unfinished':'✓ Mark workout complete'}</button></div><div class="workout-cols"><span>Exercise / target</span><span>Load (lb)</span><span>Reps by set</span></div>${r.ex.map(([name,sets,reps],i)=>{const key=exerciseKey(routine,i),e=entries[key]||{},p=previousExercise(selectedDate,routine,i);return `<div class="workout-row"><div><div class="title">${i+1}. ${escapeHtml(name)}</div><div class="rep">${sets} sets × ${reps}</div>${p?`<div class="prev">Last: ${escapeHtml(p.weight||'—')} lb · ${escapeHtml(p.reps||'—')} reps</div>`:''}</div><input aria-label="${escapeHtml(name)} resistance in pounds" placeholder="lb" inputmode="decimal" type="number" min="0" max="500" step="0.5" value="${escapeHtml(e.weight||'')}" data-work-field="weight" data-ex="${key}"><input aria-label="${escapeHtml(name)} reps" placeholder="10,9,8" maxlength="28" value="${escapeHtml(e.reps||'')}" data-work-field="reps" data-ex="${key}"></div>`}).join('')}<p class="fineprint" style="margin-top:16px">Sets/reps shown are targets, not requirements. Most sets should finish with 1–3 reps in reserve. Input values save automatically.</p></section><div class="span-4 stack"><section class="card"><h2 class="card-title">Weekly schedule</h2>${[['Mon','Upper A'],['Wed','Lower A'],['Thu','Upper B'],['Fri or Sat','Lower B']].map(x=>`<div class="item-line" style="padding:8px 0;border-bottom:1px solid var(--line)"><strong style="font-size:13px">${x[0]}</strong><span class="subtle">${x[1]}</span></div>`).join('')}<p class="hint" style="margin-top:12px">If you miss the fourth workout, continue the A/B sequence next time instead of repeatedly skipping Lower B. Select the workout from the dropdown to override the default day.</p></section><section class="card"><h2 class="card-title">This week's completed workouts</h2><div class="big-number">${Array.from({length:7},(_,i)=>offset(monday(selectedDate),i)).filter(s=>state.days[s]?.workout?.done).length}<span class="subtle"> / 3–4 planned</span></div><p class="hint">Keep Wednesday lower and Thursday upper to avoid overlapping fatigue.</p></section><section class="card"><h2 class="card-title">Recovery reminder</h2><p class="hint">Your training supports muscle retention and growth. Walking and food portions are the easier levers for fat loss; don't turn every strength session into exhaustive cardio.</p></section></div></div>`}
function settingsView(){const days=Object.keys(state.days).filter(k=>state.days[k]?.meals?.length||state.days[k]?.workout?.done).length;return `${dateHeading('Settings & your data','No account, subscriptions or automatic uploads.',false)}<div class="grid"><section class="card span-6"><h2 class="card-title">Your nutrition target</h2><p class="hint">140 g/day is an editable placeholder until you have body measurements. Protein needs depend on body weight and goals.</p><form id="goalForm" class="form-row" style="margin-top:16px"><div class="field"><label for="proteinGoal">Daily protein goal (grams)</label><input id="proteinGoal" type="number" required min="40" max="300" value="${Number(state.profile.protein)||140}"></div><button class="btn primary" type="submit">Save goal</button></form><hr class="separator"><p class="tip"><strong>No calories required:</strong> You can start with protein consistency, easy meals and your training routine, then add body measurements when ready.</p></section><section class="card span-6"><h2 class="card-title">Backup, restore & privacy</h2><p class="hint">Your meal logs, grocery list, office stock and training entries are saved <strong>in this browser on this device</strong>. They are not synchronized across devices. Clearing browser site data or opening the app under a different address can erase or separate your records.</p><p class="subtle" style="margin:10px 0">${days} days with saved activity.</p><div class="two-buttons"><button class="btn primary" data-action="export">↓ Download backup</button><button class="btn" data-action="import">↑ Restore backup</button></div><hr class="separator"><button class="btn danger" data-action="reset-data">Erase all tracking data</button></section><section class="card span-12"><h2 class="card-title">How to use Everyday Fuel</h2><div class="grid" style="margin-top:10px"><div class="span-4"><strong>Morning · 10 seconds</strong><p class="hint">Tap “Shake + water” for breakfast on the Today screen.</p></div><div class="span-4"><strong>Lunch · 10 seconds</strong><p class="hint">Tap “Rep lunch” or “Frozen work meal.” Using the frozen meal automatically reduces office stock.</p></div><div class="span-4"><strong>Once weekly · 2 minutes</strong><p class="hint">Review the shopping list, copy it to your Walmart/Sam's order, and refill office backup meals.</p></div></div></section></div>`}
function render(){nav();const app=document.getElementById('app');app.innerHTML=({today:todayView,dinners:dinnersView,work:workView,shop:shopView,train:trainView,settings:settingsView})[activeTab]()+`<div class="foot">Simple estimates, consistent habits, more time for what matters. Everything you log stays on this device unless you export it.</div>`}
function uniqueId(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function stocked(id,n){const s=state.stock.find(x=>x.id===id);if(s)s.qty=Math.max(0,s.qty+n)}
function addMeal(slot,preset){let name='',protein=0,stockId=null;if(slot==='breakfast'){if(preset==='shake'){name='Protein shake';protein=30}else{name='Protein shake with milk / oats';protein=35}}else if(slot==='lunch'){if(preset==='rep'){name='Drug-rep lunch';protein=30}else if(preset==='frozen'){name='Frozen work lunch';protein=32;stockId='frozen'}else{name='Chicken wrap';protein=38}}else if(slot==='dinner'){if(preset==='planned'){const r=recipeById(planFor(selectedDate));name=r.name;protein=r.protein}else{name='Dinner (estimate)';protein=40}}else{if(preset==='yogurt'){name='Greek yogurt';protein=18}else if(preset==='bar'){name='Protein bar';protein=20}else{name='Protein shake';protein=30}}saveMeal({id:uniqueId(),slot,name,protein,stockId})}
function saveMeal(m){const d=day();if(m.slot!=='snack'){const prior=d.meals.filter(x=>x.slot===m.slot&&x.id!==m.id);for(const p of prior){if(p.stockId)stocked(p.stockId,1)}d.meals=d.meals.filter(x=>x.slot!==m.slot||x.id===m.id)}const old=d.meals.find(x=>x.id===m.id);if(old){if(old.stockId&&old.stockId!==m.stockId)stocked(old.stockId,1);if(!old.stockId&&m.stockId)stocked(m.stockId,-1);Object.assign(old,m)}else{d.meals.push(m);if(m.stockId)stocked(m.stockId,-1)}persist();render();toast(`${SLOTS[m.slot].label} saved`)}
function removeMeal(id){const d=day(),m=d.meals.find(x=>x.id===id);if(!m)return;if(m.stockId)stocked(m.stockId,1);d.meals=d.meals.filter(x=>x.id!==id);persist();render();toast('Meal removed')}
function openMeal(slot,id=null){editingMealId=id;const m=id?meals().find(x=>x.id===id):null;document.getElementById('modalHeading').textContent=m?'Edit meal':'Add a meal';document.getElementById('mealName').value=m?.name||'';document.getElementById('mealProtein').value=m?.protein??30;document.getElementById('mealSlot').value=m?.slot||slot||'snack';document.getElementById('mealDialog').showModal()}
function openStock(){document.getElementById('stockForm').reset();document.getElementById('stockDialog').showModal()}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy unavailable in this browser')}a.remove()}}
function shoppingText(){const low=state.stock.filter(x=>x.qty<x.target),missing=state.shopping.filter(x=>!x.checked);let parts=['EVERYDAY FUEL SHOPPING LIST'];if(low.length)parts.push('\nWORK LUNCH REFILLS',...low.map(s=>`- ${s.name}: ${s.target-s.qty}`));if(missing.length)parts.push('\nHOME GROCERIES',...missing.map(s=>`- ${s.name}`));if(!low.length&&!missing.length)parts.push('\nAll caught up.');return parts.join('\n')}
function dinnerText(){const dates=Array.from({length:7},(_,i)=>offset(monday(selectedDate),i)),ingredients=[...new Set(dates.flatMap(s=>recipeById(planFor(s)).ingredients))];return ['DINNER PLAN · '+humanDate(dates[0])+'–'+humanDate(dates[6]),...dates.map(s=>humanDate(s,{weekday:'short'})+': '+recipeById(planFor(s)).name),'','INGREDIENTS',...ingredients.map(x=>'- '+x)].join('\n')}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Everyday Fuel',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='everyday-fuel-backup-'+isoLocal(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')}
function validateImport(d){return d&&d.version===1&&d.profile&&typeof d.profile.protein==='number'&&d.days&&typeof d.days==='object'&&!Array.isArray(d.days)&&d.dinners&&typeof d.dinners==='object'&&Array.isArray(d.stock)&&Array.isArray(d.shopping)}
document.getElementById('mealForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('mealName').value.trim();const protein=Number(document.getElementById('mealProtein').value),slot=document.getElementById('mealSlot').value;if(!name||!Number.isFinite(protein)||protein<0||protein>250)return;let old=editingMealId?meals().find(m=>m.id===editingMealId):null;const newMeal={id:editingMealId||uniqueId(),name,protein,slot,stockId:old?.stockId||null};document.getElementById('mealDialog').close();editingMealId=null;saveMeal(newMeal)});
document.getElementById('stockForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('stockName').value.trim(),qty=Number(document.getElementById('stockQty').value),target=Number(document.getElementById('stockTarget').value),protein=Number(document.getElementById('stockProtein').value);if(!name||![qty,target,protein].every(Number.isFinite)||qty<0||target<1)return;state.stock.push({id:uniqueId(),name,qty,target,protein,place:document.getElementById('stockLoc').value});document.getElementById('stockDialog').close();persist();render();toast('Office food added')});
document.addEventListener('submit',e=>{if(e.target.id==='addShopping'){e.preventDefault();const el=document.getElementById('shoppingName'),name=el.value.trim();if(name){state.shopping.push({id:uniqueId(),name,group:'Home',checked:false});persist();render();toast('Added to shopping list')}}if(e.target.id==='goalForm'){e.preventDefault();const n=Number(document.getElementById('proteinGoal').value);if(n>=40&&n<=300){state.profile.protein=n;persist();render();toast('Protein target saved')}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='shop-check'){const item=state.shopping.find(s=>s.id===el.dataset.id);if(item)item.checked=el.checked;persist();render()}if(el.dataset.action==='dinner-select'){state.dinners[el.dataset.date]=el.value;persist();render();toast('Dinner plan updated')}if(el.dataset.action==='routine-select'){const w=day().workout||{done:false,entries:{}};if(w.routine!==el.value){w.routine=el.value;w.done=false;day().workout=w}persist();render()}if(el.dataset.workField){const w=day().workout||(day().workout={routine:suggestedWorkout(selectedDate),done:false,entries:{}}),key=el.dataset.ex;w.entries[key]=w.entries[key]||{};w.entries[key][el.dataset.workField]=el.value;persist()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='tab'){activeTab=el.dataset.tab;window.scrollTo(0,0);render()}else if(a==='date-back'){selectedDate=offset(selectedDate,-1);render()}else if(a==='date-next'){selectedDate=offset(selectedDate,1);render()}else if(a==='choose-date'){selectedDate=el.dataset.date;render()}else if(a==='week-back'){selectedDate=offset(selectedDate,-7);render()}else if(a==='week-next'){selectedDate=offset(selectedDate,7);render()}else if(a==='quick-meal'){addMeal(el.dataset.slot,el.dataset.preset)}else if(a==='open-meal'){openMeal(el.dataset.slot)}else if(a==='edit-meal'){openMeal(null,el.dataset.id)}else if(a==='delete-meal'){removeMeal(el.dataset.id)}else if(a==='close-meal'){document.getElementById('mealDialog').close()}else if(a==='close-stock'){document.getElementById('stockDialog').close()}else if(a==='open-stock'){openStock()}else if(a==='stock-down'||a==='stock-up'){stocked(el.dataset.id,a==='stock-down'?-1:1);persist();render()}else if(a==='shop-delete'){state.shopping=state.shopping.filter(s=>s.id!==el.dataset.id);persist();render()}else if(a==='reset-shopping'){state.shopping.forEach(s=>s.checked=false);persist();render();toast('Shopping checks reset')}else if(a==='copy-shopping'){copyText(shoppingText())}else if(a==='copy-dinner-list'){copyText(dinnerText())}else if(a==='reset-dinners'){for(let i=0;i<7;i++)delete state.dinners[offset(monday(selectedDate),i)];persist();render();toast('Dinner defaults restored')}else if(a==='edit-target'){activeTab='settings';render();document.getElementById('proteinGoal')?.focus();window.scrollTo(0,0)}else if(a==='toggle-workout'){const w=day().workout||{routine:suggestedWorkout(selectedDate),done:false,entries:{}};w.done=!w.done;day().workout=w;persist();render();toast(w.done?'Workout completed':'Workout marked unfinished')}else if(a==='export'){exportBackup()}else if(a==='import'){document.getElementById('importFile').click()}else if(a==='reset-data'){if(confirm('Erase all Everyday Fuel logs, food stock and shopping edits on this device? Export a backup first if needed.')){state=fresh();persist();selectedDate=isoLocal(new Date());render();toast('All tracking data erased')}}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5_000_000)throw Error('File is too large');const obj=JSON.parse(await file.text()),d=obj.data||obj;if(!validateImport(d))throw Error('This is not a valid Everyday Fuel backup');if(confirm('Restore this backup? It will replace the tracking data saved in this browser.')){state=d;persist();render();toast('Backup restored successfully')}}catch(err){alert('Cannot restore: '+err.message)}e.target.value=''});
render();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body></html>
